---
name: PR Hugo validation

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and capture preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.150.0'
          extended: true

      - name: Build site
        run: hugo --minify --gc

      - name: Upload rendered site artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public
          path: public
          if-no-files-found: error

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: |
          hugo server --bind 127.0.0.1 --port 1313 --disableFastRender > /tmp/hugo-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT

          for i in {1..20}; do
            if curl -sSf http://127.0.0.1:1313 > /dev/null; then
              break
            fi
            sleep 1
          done

          node .github/scripts/capture-preview.mjs

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-preview-screenshots
          path: artifacts/screenshots
          if-no-files-found: error
